name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # miekg/pkcs11 and the PC/SC bindings need cgo everywhere.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install PC/SC headers, SoftHSM2 and OpenSC
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcsclite-dev softhsm2 opensc
      - name: Make sure a C compiler is available
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gcc >/dev/null; then
            choco install mingw -y --no-progress
            printf '%s\n' 'C:\ProgramData\mingw64\mingw64\bin' >> "$GITHUB_PATH"
          fi
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...
      - name: go test, with PKCS#11 against SoftHSM2
        if: runner.os == 'Linux'
        run: ./scripts/softhsm-tests.sh

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      version: ci-${{ github.sha }}
